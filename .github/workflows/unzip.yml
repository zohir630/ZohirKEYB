name: Unzip File

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract (7z)
        run: |
          7z x simple-keyboard-master.zip -ounzipped -y
          ls -R unzipped | head -50

      - uses: actions/upload-artifact@v4
        with:
          name: simple-keyboard
          path: unzipped
