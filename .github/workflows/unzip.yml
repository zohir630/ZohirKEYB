name: Unzip File

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip simple-keyboard-master.zip
        run: |
          unzip -o simple-keyboard-master.zip -d unzipped

      - name: Show extracted files
        run: ls -R unzipped | head -50

      # অপশনাল: unzip করা ফাইল repo-তে commit করতে চাইলে
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add unzipped
          git commit -m "Unzip simple-keyboard-master.zip" || echo "No changes"
          git push

      # অপশনাল: artifact হিসেবে ডাউনলোড করতে চাইলে
      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: simple-keyboard
          path: unzipped
